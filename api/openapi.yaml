      x-requirements: [BP-02]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/publish:
    post:
      tags: [Catalog]
      operationId: publishPackage
      summary: Terbitkan paket; 403 tenant_not_verified, 422 bila belum lengkap
      x-permission: package.publish
      x-requirements: [FR-PPIU-02, BP-02]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/unpublish:
    post:
      tags: [Catalog]
      operationId: unpublishPackage
      summary: Tarik paket dari marketplace
      x-permission: package.publish
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/images:
    post:
      tags: [Catalog]
      operationId: addPackageImage
      summary: Tambah foto paket (maksimal 10)
      x-permission: package.manage
      x-requirements: [FR-PPIU-04]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/images/{image}:
    delete:
      tags: [Catalog]
      operationId: deletePackageImage
      summary: Hapus foto paket
      x-permission: package.manage
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
        - $ref: '#/components/parameters/ImageId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/images/order:
    put:
      tags: [Catalog]
      operationId: reorderPackageImages
      summary: Urutan foto; foto pertama menjadi sampul
      x-permission: package.manage
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ids]
              properties:
                image_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/departures:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PackageId'
    get:
      tags: [Catalog]
      operationId: listDepartures
      summary: Keberangkatan sebuah paket
      x-permission: package.view
      responses:
        '200': { $ref: '#/components/responses/DepartureList' }
        '4XX': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalog]
      operationId: createDeparture
      summary: Buat keberangkatan beserta harga per kamar
      x-permission: departure.manage
      x-requirements: [FR-PPIU-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartureCreate' }
      responses:
        '201': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/DepartureId'
    get:
      tags: [Catalog]
      operationId: getDeparture
      summary: Detail keberangkatan dan kursi
      x-permission: package.view
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Catalog]
      operationId: updateDeparture
      summary: Ubah kuota, tanggal, DP; 409 bila kuota di bawah kursi terpakai atau tanggal diubah saat ada booking aktif
      x-permission: departure.manage
      x-requirements: [FR-PPIU-05, FR-PPIU-07, CR-03]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartureInput' }
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/prices:
    put:
      tags: [Catalog]
      operationId: replaceDeparturePrices
      summary: Ganti harga per kamar; booking lama tidak terpengaruh
      x-permission: departure.price.update
      x-requirements: [FR-PPIU-06, BR-08]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DepartureId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeparturePrice' } }
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/close-sales:
    post:
      tags: [Catalog]
      operationId: closeDepartureSales
      summary: Tutup penjualan
      x-permission: departure.manage
      x-requirements: [FR-PPIU-07]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DepartureId'
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/open-sales:
    post:
      tags: [Catalog]
      operationId: openDepartureSales
      summary: Buka kembali penjualan
      x-permission: departure.manage
      x-requirements: [FR-PPIU-07]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DepartureId'
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/cancel:
    post:
      tags: [Catalog]
      operationId: cancelDeparture
      summary: Batalkan keberangkatan; respons berisi booking aktif yang harus diproses
      x-permission: departure.manage
      x-requirements: [BP-08]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DepartureId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/BookingList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/complete:
    post:
      tags: [Catalog]
      operationId: completeDeparture
      summary: Tandai selesai; booking departed menjadi completed
      x-permission: departure.manage
      x-requirements: [BP-10]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DepartureId'
      responses:
        '200': { $ref: '#/components/responses/Departure' }
        '4XX': { $ref: '#/components/responses/Error' }

