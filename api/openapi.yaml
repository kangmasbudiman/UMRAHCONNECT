      x-requirements: [FR-FIN-09]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdsInput' }
      responses:
        '200': { $ref: '#/components/responses/CommissionList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/payouts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Finance]
      operationId: listPayouts
      summary: Pengajuan pencairan dan payout
      x-permission: commission.view
      x-requirements: [FR-FIN-09]
      parameters:
        - { name: 'filter[status]', in: query, schema: { $ref: '#/components/schemas/PayoutStatus' } }
      responses:
        '200': { $ref: '#/components/responses/PayoutList' }
        '4XX': { $ref: '#/components/responses/Error' }
    post:
      tags: [Finance]
      operationId: createPayout
      summary: Buat payout langsung tanpa pengajuan agen
      x-permission: payout.pay
      x-requirements: [BP-07]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IdsInput'
                - type: object
                  required: [agent_id]
                  properties:
                    agent_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201': { $ref: '#/components/responses/Payout' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/payouts/{payout}/pay:
    post:
      tags: [Finance]
      operationId: payPayout
      summary: Catat transfer komisi ke agen; semua komisinya menjadi paid
      x-permission: payout.pay
      x-requirements: [FR-FIN-09]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PayoutId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_at, proof_file_id]
              properties:
                paid_at: { $ref: '#/components/schemas/Timestamp' }
                proof_file_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/payouts/{payout}/reject:
    post:
      tags: [Finance]
      operationId: rejectPayout
      summary: Tolak payout; komisi kembali approved
      x-permission: payout.pay
      x-requirements: [BP-07]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PayoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Payout' }
        '4XX': { $ref: '#/components/responses/Error' }

