  schemas:
    Uuid:
      type: string
      format: uuid
      examples: ['01932f6a-7b1c-7d4e-9a2b-3c4d5e6f7a8b']
    Money:
      type: integer
      minimum: 0
      description: Rupiah penuh tanpa desimal.
      examples: [32500000]
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-11-14T03:00:00Z']
    Date:
      type: string
      format: date
      examples: ['2027-02-10']
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Format E.164.
      examples: ['+6281234567890']

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthenticated
                - forbidden
                - two_factor_required
                - tenant_not_verified
                - tenant_suspended
                - partnership_inactive
                - not_found
                - seats_unavailable
                - pilgrim_already_booked
                - invalid_transition
                - already_processed
                - idempotency_conflict
                - precondition_failed
                - validation_failed
                - refund_exceeds_paid
                - reason_required
                - account_locked
                - rate_limited
                - server_error
            message: { type: string, description: Pesan bahasa Indonesia untuk ditampilkan. }
            details: { type: [object, 'null'], additionalProperties: true }
            errors:
              type: [object, 'null']
              description: Error validasi per field.
              additionalProperties: { type: array, items: { type: string } }
            request_id: { type: string }
    ListMeta:
      type: object
      required: [next_cursor, limit]
      properties:
        next_cursor: { type: [string, 'null'] }
        limit: { type: integer }
    CommissionListMeta:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          properties:
            totals:
              type: object
              description: Total nominal per status komisi.
              additionalProperties: { $ref: '#/components/schemas/Money' }

    # ---- Enum ----
    UserStatus: { type: string, enum: [unclaimed, active, locked, deactivated] }
    PlatformRole: { type: [string, 'null'], enum: [super_admin, platform_admin, null] }
    TenantRole: { type: string, enum: [owner, admin, finance] }
    MemberStatus: { type: string, enum: [invited, active, deactivated] }
    TenantVerificationStatus: { type: string, enum: [draft, pending_review, needs_revision, verified, rejected, suspended] }
    TenantDocumentType: { type: string, enum: [akta, nib, npwp, ppiu_license, pic_ktp, other] }
    ReviewStatus: { type: string, enum: [submitted, accepted, rejected] }
    BankAccountStatus: { type: string, enum: [pending, verified, inactive] }
    PackageStatus: { type: string, enum: [draft, published, archived, taken_down] }
    SalesStatus: { type: string, enum: [open, closed, full] }
    DepartureStatus: { type: string, enum: [scheduled, departed, completed, cancelled] }
    RoomType: { type: string, enum: [quad, triple, double] }
    PartnershipStatus: { type: string, enum: [invited, applied, active, rejected, suspended, ended] }
    PartnershipSource: { type: string, enum: [applied, invited] }
    SchemeScope: { type: string, enum: [default, package, agent, agent_package] }
    SchemeType: { type: string, enum: [flat, percent] }
    EarnOn: { type: string, enum: [fully_paid, dp_verified] }
    FollowUpStatus: { type: string, enum: [new, contacted, interested, booked, lost] }
    Gender: { type: string, enum: [L, P] }
    PilgrimDocumentType: { type: string, enum: [ktp, passport, photo, vaccine, other] }
    PilgrimDocumentStatus: { type: string, enum: [active, replaced] }
    DocumentReviewStatus: { type: string, enum: [accepted, rejected] }
    BookingStatus: { type: string, enum: [awaiting_dp, dp_verified, fully_paid, departed, completed, expired, cancelled] }
    AttributionSource: { type: string, enum: [agent_created, ppiu_assigned, manual_code, referral_link, none] }
    BookingChannel: { type: string, enum: [marketplace, agent_portal, ppiu_dashboard] }
    CancelRequestStatus: { type: string, enum: [pending, approved, rejected] }
    InvoiceType: { type: string, enum: [dp, final, full] }
    InvoiceStatus: { type: string, enum: [unpaid, partial, paid, cancelled] }
    PaymentMethod: { type: string, enum: [bank_transfer, cash, reallocation, gateway] }
    PaymentStatus: { type: string, enum: [pending, verified, rejected] }
    RefundType: { type: string, enum: [bank_transfer, reallocation] }
    CommissionStatus: { type: string, enum: [estimated, earned, approved, paid, cancelled] }
    PayoutStatus: { type: string, enum: [requested, paid, rejected] }
    FilePurpose:
      type: string
      enum: [package_image, logo, tenant_document, ktp, pilgrim_document, payment_proof, refund_proof, payout_proof, invoice_pdf, receipt_pdf, report_export]

    # ---- Akun ----
    User:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/UserStatus' }
        two_factor_enabled: { type: boolean }
        platform_role: { $ref: '#/components/schemas/PlatformRole' }
        last_login_at: { type: [string, 'null'], format: date-time }
    UserUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        phone: { $ref: '#/components/schemas/Phone' }
    Contexts:
      type: object
      required: [user, tenants, agent, pilgrim, platform_role]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tenants:
          type: array
          items:
            type: object
            required: [id, brand_name, role, tenant_status, permissions]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              brand_name: { type: string }
              role: { $ref: '#/components/schemas/TenantRole' }
              tenant_status: { $ref: '#/components/schemas/TenantVerificationStatus' }
              permissions: { type: array, items: { type: string }, examples: [[package.view, booking.view]] }
        agent:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string }
            active_partnerships: { type: integer }
        pilgrim:
          type: object
          properties:
            managed_pilgrims: { type: integer }
            active_bookings: { type: integer }
        platform_role: { $ref: '#/components/schemas/PlatformRole' }

    # ---- Tenant ----
    TenantRef:
      type: object
      required: [id, brand_name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        brand_name: { type: string }
        whatsapp: { type: [string, 'null'] }
    TenantPublic:
      type: object
      required: [id, slug, brand_name, legal_name, ppiu_license_no, verified]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        brand_name: { type: string }
        legal_name: { type: string }
        ppiu_license_no: { type: string }
        verified: { type: boolean, const: true }
        city: { type: string }
        province: { type: string }
        address: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        email: { type: string, format: email }
        logo_url: { type: [string, 'null'], format: uri }
    TenantPublicDetail:
      allOf:
        - $ref: '#/components/schemas/TenantPublic'
        - type: object
          properties:
            packages: { type: array, items: { $ref: '#/components/schemas/PackageSummary' } }
    TenantInput:
      type: object
      properties:
        legal_name: { type: string, maxLength: 200 }
        brand_name: { type: string, maxLength: 200 }
        ppiu_license_no: { type: string, maxLength: 100 }
        license_expires_on: { $ref: '#/components/schemas/Date' }
        nib: { type: string, maxLength: 30 }
        npwp: { type: string, maxLength: 30 }
        address: { type: string }
        city: { type: string, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        whatsapp: { $ref: '#/components/schemas/Phone' }
        email: { type: string, format: email }
        logo_file_id: { $ref: '#/components/schemas/Uuid' }
    Tenant:
      allOf:
        - $ref: '#/components/schemas/TenantInput'
        - type: object
          required: [id, code, slug, verification_status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            code: { type: string, maxLength: 10 }
            slug: { type: string }
            verification_status: { $ref: '#/components/schemas/TenantVerificationStatus' }
            verified_at: { type: [string, 'null'], format: date-time }
            status_note: { type: [string, 'null'] }
            settings:
              type: object
              properties:
                dp_deadline_hours_default: { type: integer }
                commission_earn_on_default: { $ref: '#/components/schemas/EarnOn' }
    TenantDocument:
      type: object
      required: [id, type, file_id, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/TenantDocumentType' }
        file_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        review_note: { type: [string, 'null'] }
    Member:
      type: object
      required: [id, user, role, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/TenantRole' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        invited_at: { type: [string, 'null'], format: date-time }
        joined_at: { type: [string, 'null'], format: date-time }
    BankAccount:
      type: object
      required: [id, bank_name, account_no, account_holder, status, is_default]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        bank_name: { type: string }
        account_no: { type: string }
        account_holder: { type: string }
        status: { $ref: '#/components/schemas/BankAccountStatus' }
        is_default: { type: boolean }
    PayTo:
      type: object
      required: [bank_name, account_no, account_holder]
      properties:
        bank_name: { type: string }
        account_no: { type: string }
        account_holder: { type: string }

    # ---- Paket dan keberangkatan ----
    DeparturePrice:
      type: object
      required: [room_type, price_amount]
      properties:
        room_type: { $ref: '#/components/schemas/RoomType' }
        price_amount: { $ref: '#/components/schemas/Money' }
    ItineraryDay:
      type: object
      required: [day, title]
      properties:
        day: { type: integer, minimum: 1 }
        title: { type: string }
        activities: { type: array, items: { type: string } }
    PackageInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        duration_days: { type: integer, minimum: 1 }
        airline: { type: string, maxLength: 100 }
        hotel_makkah: { type: [string, 'null'] }
        hotel_makkah_stars: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        hotel_makkah_distance_m: { type: [integer, 'null'], minimum: 0 }
        hotel_madinah: { type: [string, 'null'] }
        hotel_madinah_stars: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        hotel_madinah_distance_m: { type: [integer, 'null'], minimum: 0 }
        description: { type: string }
        itinerary: { type: array, items: { $ref: '#/components/schemas/ItineraryDay' } }
        facilities: { type: array, items: { type: string } }
        includes: { type: array, items: { type: string } }
        excludes: { type: array, items: { type: string } }
        document_requirements: { type: string }
        payment_terms: { type: string }
        cancellation_terms: { type: string, description: Wajib terisi sebelum terbit. }
    PackageImage:
      type: object
      required: [id, file_id, url, sort_order]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        file_id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, format: uri }
        sort_order: { type: integer, minimum: 0 }
    Package:
      allOf:
        - $ref: '#/components/schemas/PackageInput'
        - type: object
          required: [id, slug, status]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            slug: { type: string }
            status: { $ref: '#/components/schemas/PackageStatus' }
            taken_down_reason: { type: [string, 'null'] }
            published_at: { type: [string, 'null'], format: date-time }
            images: { type: array, items: { $ref: '#/components/schemas/PackageImage' } }
    PackageSummary:
      type: object
      required: [id, slug, name, tenant, duration_days, airline, price_from_amount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        tenant:
          type: object
          properties:
            slug: { type: string }
            brand_name: { type: string }
            verified: { type: boolean }
            ppiu_license_no: { type: string }
        duration_days: { type: integer }
        airline: { type: string }
        hotel_makkah_stars: { type: [integer, 'null'] }
        cover_image_url: { type: [string, 'null'], format: uri }
        price_from_amount: { $ref: '#/components/schemas/Money' }
        next_departure:
          type: [object, 'null']
          properties:
            departure_date: { $ref: '#/components/schemas/Date' }
            departure_city: { type: string }
            seats_remaining: { type: integer }
    DeparturePublic:
      type: object
      required: [id, departure_date, return_date, departure_city, seats_remaining, sales_status, prices]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        departure_date: { $ref: '#/components/schemas/Date' }
        return_date: { $ref: '#/components/schemas/Date' }
        departure_city: { type: string }
        seats_remaining: { type: integer, minimum: 0 }
        sales_status: { $ref: '#/components/schemas/SalesStatus' }
        dp_min_per_pax_amount: { $ref: '#/components/schemas/Money' }
        final_payment_due_on: { $ref: '#/components/schemas/Date' }
        prices: { type: array, items: { $ref: '#/components/schemas/DeparturePrice' } }
    PackagePublicDetail:
      allOf:
        - $ref: '#/components/schemas/Package'
        - type: object
          required: [tenant, departures]
          properties:
            tenant: { $ref: '#/components/schemas/TenantPublic' }
            departures: { type: array, items: { $ref: '#/components/schemas/DeparturePublic' } }
    DepartureScheduleItem:
      allOf:
        - $ref: '#/components/schemas/DeparturePublic'
        - type: object
          properties:
            package: { type: object, properties: { slug: { type: string }, name: { type: string } } }
            tenant: { type: object, properties: { slug: { type: string }, brand_name: { type: string } } }
    DepartureInput:
      type: object
      properties:
        departure_date: { $ref: '#/components/schemas/Date' }
        return_date: { $ref: '#/components/schemas/Date' }
        departure_city: { type: string, maxLength: 100 }
        quota: { type: integer, minimum: 1 }
        dp_min_per_pax_amount: { $ref: '#/components/schemas/Money' }
        dp_deadline_hours: { type: integer, minimum: 1, default: 48 }
        final_payment_due_on: { $ref: '#/components/schemas/Date' }
    DepartureCreate:
      allOf:
        - $ref: '#/components/schemas/DepartureInput'
        - type: object
          required: [departure_date, return_date, departure_city, quota, dp_min_per_pax_amount, final_payment_due_on, prices]
          properties:
            prices: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DeparturePrice' } }
    Departure:
      allOf:
        - $ref: '#/components/schemas/DeparturePublic'
        - type: object
          required: [package_id, quota, seats_held, seats_confirmed, status]
          properties:
            package_id: { $ref: '#/components/schemas/Uuid' }
            quota: { type: integer }
            seats_held: { type: integer }
            seats_confirmed: { type: integer }
            dp_deadline_hours: { type: integer }
            status: { $ref: '#/components/schemas/DepartureStatus' }
            active_bookings_count: { type: integer, description: Diisi pada respons perubahan harga sebagai peringatan. }

    # ---- Agen dan kemitraan ----
    AgentRef:
      type: object
      required: [id, code, display_name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, minLength: 6, maxLength: 8 }
        display_name: { type: string }
        whatsapp: { type: [string, 'null'] }
        domicile_city: { type: [string, 'null'] }
    AgentProfileInput:
      type: object
      properties:
        nik: { type: string, pattern: '^[0-9]{16}$' }
        ktp_file_id: { $ref: '#/components/schemas/Uuid' }
        domicile_city: { type: string, maxLength: 100 }
        payout_bank_name: { type: string }
        payout_account_no: { type: string }
        payout_account_holder: { type: string }
    AgentProfile:
      type: object
      required: [id, code, nik_masked, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        nik_masked: { type: string, examples: ['3571••••••••0012'] }
        domicile_city: { type: string }
        payout_bank_name: { type: string }
        payout_account_no_masked: { type: string }
        payout_account_holder: { type: string }
        status: { type: string, enum: [active, suspended] }
    CommissionSchemeInput:
      type: object
      required: [scope, type]
      properties:
        scope: { $ref: '#/components/schemas/SchemeScope' }
        package_id: { type: [string, 'null'], format: uuid }
        agent_id: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/SchemeType' }
        flat_amount: { type: [integer, 'null'], minimum: 0, description: 'Rupiah per peserta, wajib bila type flat.' }
        percent_bp: { type: [integer, 'null'], minimum: 0, maximum: 10000, description: 'Basis poin, wajib bila type percent.' }
        earn_on: { $ref: '#/components/schemas/EarnOn' }
    CommissionScheme:
      allOf:
        - $ref: '#/components/schemas/CommissionSchemeInput'
        - type: object
          required: [id, effective_from]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            effective_from: { $ref: '#/components/schemas/Timestamp' }
            effective_to: { type: [string, 'null'], format: date-time }
    Partnership:
      type: object
      required: [id, tenant, agent, status, source]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        agent: { $ref: '#/components/schemas/AgentRef' }
        status: { $ref: '#/components/schemas/PartnershipStatus' }
        source: { $ref: '#/components/schemas/PartnershipSource' }
        message: { type: [string, 'null'] }
        reject_reason: { type: [string, 'null'] }
        commission_scheme:
          oneOf:
            - $ref: '#/components/schemas/CommissionScheme'
            - type: 'null'
        decided_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AgentTenant:
      allOf:
        - $ref: '#/components/schemas/TenantPublic'
        - type: object
          properties:
            partnership_id: { type: [string, 'null'], format: uuid }
            partnership_status:
              oneOf:
                - $ref: '#/components/schemas/PartnershipStatus'
                - type: 'null'
    AgentPackage:
      allOf:
        - $ref: '#/components/schemas/PackageSummary'
        - type: object
          properties:
            commission_scheme: { $ref: '#/components/schemas/CommissionScheme' }
    ReferralLink:
      type: object
      required: [id, tenant_id, code, url, click_count, is_active]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        package_id: { type: [string, 'null'], format: uuid }
        code: { type: string, maxLength: 16 }
        url: { type: string, format: uri }
        click_count: { type: integer }
        is_active: { type: boolean }
    Prospect:
      type: object
      required: [name, phone, follow_up_status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { type: [string, 'null'], format: uuid }
        package_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        notes: { type: [string, 'null'] }
        follow_up_status: { $ref: '#/components/schemas/FollowUpStatus' }
        next_follow_up_on: { type: [string, 'null'], format: date }

    # ---- Jamaah dan booking ----
    PilgrimInput:
      type: object
      properties:
        full_name: { type: string, maxLength: 150, description: Sesuai paspor. }
        nik: { type: string, pattern: '^[0-9]{16}$' }
        birth_place: { type: string }
        birth_date: { $ref: '#/components/schemas/Date' }
        gender: { $ref: '#/components/schemas/Gender' }
        passport_no: { type: [string, 'null'] }
        passport_expires_on: { type: [string, 'null'], format: date }
        phone: { type: [string, 'null'] }
        emergency_contact:
          type: [object, 'null']
          properties:
            name: { type: string }
            relation: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
        mahram_pilgrim_id: { type: [string, 'null'], format: uuid }
    Pilgrim:
      allOf:
        - $ref: '#/components/schemas/PilgrimInput'
        - type: object
          required: [id, full_name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
    PilgrimIdentity:
      type: object
      required: [pilgrim_id, nik]
      properties:
        pilgrim_id: { $ref: '#/components/schemas/Uuid' }
        nik: { type: string }
        passport_no: { type: [string, 'null'] }
        passport_expires_on: { type: [string, 'null'], format: date }
        birth_date: { $ref: '#/components/schemas/Date' }
    DocumentReviewInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/DocumentReviewStatus' }
        note: { type: [string, 'null'], description: Wajib bila rejected. }
    DocumentReview:
      allOf:
        - $ref: '#/components/schemas/DocumentReviewInput'
        - type: object
          properties:
            tenant: { $ref: '#/components/schemas/TenantRef' }
            reviewed_at: { $ref: '#/components/schemas/Timestamp' }
    PilgrimDocument:
      type: object
      required: [id, pilgrim_id, type, file_id, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        pilgrim_id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/PilgrimDocumentType' }
        file_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/PilgrimDocumentStatus' }
        reviews:
          type: array
          description: Hasil pemeriksaan per PPIU; di endpoint tenant hanya berisi review tenant itu.
          items: { $ref: '#/components/schemas/DocumentReview' }
    Booker:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
    ParticipantInput:
      type: object
      required: [room_type]
      description: Isi `pilgrim_id` (data tersimpan) atau `pilgrim` (data baru).
      properties:
        pilgrim_id: { $ref: '#/components/schemas/Uuid' }
        pilgrim: { $ref: '#/components/schemas/PilgrimInput' }
        room_type: { $ref: '#/components/schemas/RoomType' }
    BookingCreate:
      type: object
      required: [departure_id, participants, accept_package_terms]
      properties:
        departure_id: { $ref: '#/components/schemas/Uuid' }
        participants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ParticipantInput' } }
        referral_code: { type: [string, 'null'], description: Dari cookie `uc_ref`; divalidasi ulang (CR-01). }
        agent_code: { type: [string, 'null'], description: Kode agen yang diketik pemesan. }
        accept_package_terms: { type: boolean, const: true }
    BookingCreateByStaff:
      allOf:
        - $ref: '#/components/schemas/BookingCreate'
        - type: object
          required: [booker]
          properties:
            booker: { $ref: '#/components/schemas/Booker' }
            agent_id: { type: [string, 'null'], format: uuid, description: Hanya untuk booking oleh PPIU; harus mitra Aktif. }
    Participant:
      type: object
      required: [pilgrim_id, full_name, room_type, price_amount]
      properties:
        pilgrim_id: { $ref: '#/components/schemas/Uuid' }
        full_name: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        room_type: { $ref: '#/components/schemas/RoomType' }
        price_amount: { $ref: '#/components/schemas/Money' }
        nik_masked: { type: string, description: Hanya di endpoint tenant. }
        passport_no_masked: { type: [string, 'null'], description: Hanya di endpoint tenant. }
    Invoice:
      type: object
      required: [id, number, type, amount, paid_amount, due_at, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, examples: ['INV/PPIUA/2026/0012'] }
        booking_id: { $ref: '#/components/schemas/Uuid' }
        booking_code: { type: string }
        type: { $ref: '#/components/schemas/InvoiceType' }
        amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        due_at: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        pay_to: { $ref: '#/components/schemas/PayTo' }
    ReceiptRef:
      type: object
      required: [id, number]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        number: { type: string, examples: ['KW/PPIUA/2026/0007'] }
    Payment:
      type: object
      required: [id, invoice_id, method, claimed_amount, paid_on, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        invoice_id: { $ref: '#/components/schemas/Uuid' }
        invoice_number: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        claimed_amount: { $ref: '#/components/schemas/Money' }
        verified_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        paid_on: { $ref: '#/components/schemas/Date' }
        sender_bank: { type: [string, 'null'] }
        sender_name: { type: [string, 'null'] }
        proof_file_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        reject_reason: { type: [string, 'null'] }
        split_from_payment_id: { type: [string, 'null'], format: uuid }
        receipt:
          oneOf:
            - $ref: '#/components/schemas/ReceiptRef'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
    PaymentUpload:
      type: object
      required: [amount, paid_on, proof_file_id]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { $ref: '#/components/schemas/Date' }
        sender_bank: { type: string }
        sender_name: { type: string }
        proof_file_id: { $ref: '#/components/schemas/Uuid' }
    PaymentRecord:
      type: object
      required: [method, amount, paid_on]
      properties:
        method: { type: string, enum: [bank_transfer, cash, reallocation] }
        amount: { $ref: '#/components/schemas/Money' }
        paid_on: { $ref: '#/components/schemas/Date' }
        sender_name: { type: string }
        proof_file_id: { type: [string, 'null'], format: uuid }
    VerifyPaymentResult:
      type: object
      required: [payments, invoices, booking]
      properties:
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        invoices:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              paid_amount: { $ref: '#/components/schemas/Money' }
              status: { $ref: '#/components/schemas/InvoiceStatus' }
        booking:
          type: object
          properties:
            code: { type: string }
            status: { $ref: '#/components/schemas/BookingStatus' }
            paid_amount: { $ref: '#/components/schemas/Money' }
    RefundInput:
      type: object
      required: [type, amount, paid_on, note]
      properties:
        type: { $ref: '#/components/schemas/RefundType' }
        amount: { type: integer, minimum: 1 }
        target_booking_id: { type: [string, 'null'], format: uuid, description: Wajib untuk reallocation. }
        paid_on: { $ref: '#/components/schemas/Date' }
        proof_file_id: { type: [string, 'null'], format: uuid }
        note: { type: string, description: Dasar perhitungan refund. }
    Refund:
      allOf:
        - $ref: '#/components/schemas/RefundInput'
        - type: object
          required: [id, booking_id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            booking_id: { $ref: '#/components/schemas/Uuid' }
            recorded_by: { $ref: '#/components/schemas/Uuid' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
    CancelRequest:
      type: object
      required: [status, requested_at]
      properties:
        status: { $ref: '#/components/schemas/CancelRequestStatus' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        reason: { type: [string, 'null'] }
    Booking:
      type: object
      required: [id, code, status, tenant, departure, attribution_source, participant_count, participants, total_amount, dp_amount, paid_amount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, examples: ['UC-2611-0001'] }
        status: { $ref: '#/components/schemas/BookingStatus' }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        package: { type: object, properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string } } }
        departure:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            departure_date: { $ref: '#/components/schemas/Date' }
            departure_city: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/AgentRef'
            - type: 'null'
        attribution_source: { $ref: '#/components/schemas/AttributionSource' }
        channel: { $ref: '#/components/schemas/BookingChannel' }
        booker: { $ref: '#/components/schemas/Booker' }
        participant_count: { type: integer, minimum: 1 }
        participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }
        total_amount: { $ref: '#/components/schemas/Money' }
        dp_amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        hold_expires_at: { type: [string, 'null'], format: date-time }
        invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        pay_to: { $ref: '#/components/schemas/PayTo' }
        cancel_request:
          oneOf:
            - $ref: '#/components/schemas/CancelRequest'
            - type: 'null'
        refund_decided_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        refund_basis: { type: [string, 'null'] }
        confirmed_at: { $ref: '#/components/schemas/Timestamp' }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
    BookingAgentView:
      type: object
      required: [id, code, status, tenant, participants, total_amount, paid_amount]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        package: { type: object, properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string } } }
        departure:
          type: object
          properties:
            departure_date: { $ref: '#/components/schemas/Date' }
            departure_city: { type: string }
        booker: { $ref: '#/components/schemas/Booker' }
        participants:
          type: array
          items:
            type: object
            properties:
              full_name: { type: string }
              room_type: { $ref: '#/components/schemas/RoomType' }
        total_amount: { $ref: '#/components/schemas/Money' }
        paid_amount: { $ref: '#/components/schemas/Money' }
        invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        cancel_request_status:
          oneOf:
            - $ref: '#/components/schemas/CancelRequestStatus'
            - type: 'null'
        refund_total_amount: { $ref: '#/components/schemas/Money' }
    AttributionUpdate:
      type: object
      required: [agent_id, reason]
      properties:
        agent_id: { type: [string, 'null'], format: uuid, description: null = tanpa agen. }
        reason: { type: string, minLength: 5 }
    BookingCancel:
      type: object
      required: [reason, refund_amount, refund_basis]
      properties:
        reason: { type: string }
        refund_amount: { $ref: '#/components/schemas/Money' }
        refund_basis: { type: string }
    Note:
      type: object
      required: [id, author, body, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        author: { type: object, properties: { id: { $ref: '#/components/schemas/Uuid' }, name: { type: string } } }
        body: { type: string, minLength: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---- Komisi ----
    Commission:
      type: object
      required: [id, booking, agent, tenant, amount, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        booking: { type: object, properties: { id: { $ref: '#/components/schemas/Uuid' }, code: { type: string } } }
        agent: { $ref: '#/components/schemas/AgentRef' }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/CommissionStatus' }
        earned_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        payout_id: { type: [string, 'null'], format: uuid }
    Payout:
      type: object
      required: [id, agent, total_amount, status, requested_at, commission_ids]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant: { $ref: '#/components/schemas/TenantRef' }
        agent: { $ref: '#/components/schemas/AgentRef' }
        total_amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        requested_by: { $ref: '#/components/schemas/Uuid' }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        paid_at: { type: [string, 'null'], format: date-time }
        proof_file_id: { type: [string, 'null'], format: uuid }
        reject_reason: { type: [string, 'null'] }
        commission_ids: { type: array, items: { $ref: '#/components/schemas/Uuid' } }

    # ---- Sistem ----
    Notification:
      type: object
      required: [id, event, channel, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        event: { type: string, examples: [invoice.due_soon] }
        channel: { type: string, enum: [in_app, email, whatsapp, push] }
        payload: { type: object, additionalProperties: true }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    File:
      type: object
      required: [id, purpose, mime_type, size_bytes]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        purpose: { $ref: '#/components/schemas/FilePurpose' }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer }
        url: { type: [string, 'null'], format: uri, description: Signed URL 10 menit untuk file privat; URL CDN untuk file publik. }
    Report:
      type: object
      required: [columns, rows]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        totals: { type: object, additionalProperties: true }
    SupportSession:
      type: object
      required: [id, tenant_id, reason, ticket_no, started_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string }
        ticket_no: { type: string, maxLength: 50 }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { type: [string, 'null'], format: date-time }
    AuditLog:
      type: object
      required: [id, action, entity_type, entity_id, created_at]
      properties:
        id: { type: integer }
        tenant_id: { type: [string, 'null'], format: uuid }
        actor_user_id: { type: [string, 'null'], format: uuid }
        actor_context: { type: string }
        action: { type: string, examples: [booking.attribution_changed] }
        entity_type: { type: string }
        entity_id: { $ref: '#/components/schemas/Uuid' }
        old_values: { type: [object, 'null'], additionalProperties: true }
        new_values: { type: [object, 'null'], additionalProperties: true }
        reason: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Setting:
      type: object
      required: [key, value]
      properties:
        key: { type: string, examples: [attribution.window_days] }
        value: { description: Nilai JSON apa pun. }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3 }
    IdsInput:
      type: object
      required: [commission_ids]
      properties:
        commission_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }

paths:
  # ============================ AUTH ============================
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Membuat akun
      security: []
      x-requirements: [FR-AUTH-01, FR-AUTH-08]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, terms_version, privacy_version]
              properties:
                name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                phone: { $ref: '#/components/schemas/Phone' }
                password: { type: string, minLength: 8, format: password }
                terms_version: { type: string }
                privacy_version: { type: string }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/otp/send:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: Mengirim OTP
      security: []
      x-requirements: [FR-AUTH-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, channel, purpose]
              properties:
                identifier: { type: string, description: Email atau nomor HP. }
                channel: { type: string, enum: [email, whatsapp] }
                purpose: { type: string, enum: [verify, reset, two_factor] }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Memverifikasi OTP
      security: []
      x-requirements: [FR-AUTH-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, purpose, code]
              properties:
                identifier: { type: string }
                purpose: { type: string, enum: [verify, reset, two_factor] }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OTP valid; untuk purpose reset mengembalikan reset_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: { type: boolean }
                      reset_token: { type: [string, 'null'] }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login web (sesi cookie)
      description: Bila peran wajib 2FA, respons berisi `two_factor_required` dan `challenge_token`. 5 kali gagal mengunci akun 15 menit (423).
      security: []
      x-requirements: [FR-AUTH-02, FR-AUTH-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login berhasil atau butuh tantangan 2FA
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        required: [user]
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                      - type: object
                        required: [two_factor_required, challenge_token]
                        properties:
                          two_factor_required: { type: boolean, const: true }
                          challenge_token: { type: string }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/two-factor/challenge:
    post:
      tags: [Auth]
      operationId: completeTwoFactorChallenge
      summary: Menyelesaikan login dengan kode 2FA
      security: []
      x-requirements: [FR-AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: 'Kode TOTP, OTP, atau kode cadangan.' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Mengakhiri sesi atau mencabut token aktif
      x-requirements: [FR-AUTH-02]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Mengganti kata sandi dengan reset_token dari OTP
      security: []
      x-requirements: [FR-AUTH-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password]
              properties:
                reset_token: { type: string }
                password: { type: string, minLength: 8, format: password }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/two-factor/setup:
    post:
      tags: [Auth]
      operationId: setupTwoFactor
      summary: Membuat rahasia TOTP dan QR
      x-requirements: [FR-AUTH-03]
      responses:
        '200':
          description: Rahasia dibuat; aktif setelah dikonfirmasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [otpauth_url, qr_svg]
                    properties:
                      otpauth_url: { type: string }
                      qr_svg: { type: string }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/two-factor/confirm:
    post:
      tags: [Auth]
      operationId: confirmTwoFactor
      summary: Mengaktifkan 2FA dan mengembalikan 8 kode cadangan
      x-requirements: [FR-AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 2FA aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recovery_codes: { type: array, minItems: 8, maxItems: 8, items: { type: string } }
        '4XX': { $ref: '#/components/responses/Error' }
  /auth/tokens:
    post:
      tags: [Auth]
      operationId: issueToken
      summary: Login aplikasi mobile (Bearer token)
      security: []
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password, device_name, ability]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
                device_name: { type: string }
                ability: { type: string, enum: [agent, pilgrim] }
      responses:
        '200':
          description: Token dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [token]
                    properties:
                      token: { type: string }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/contexts:
    get:
      tags: [Auth]
      operationId: getContexts
      summary: Konteks dan permission pengguna untuk membangun menu
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Contexts' }
        '4XX': { $ref: '#/components/responses/Error' }

  # ============================ PUBLIC ============================
  /public/packages:
    get:
      tags: [Public]
      operationId: listPublicPackages
      summary: Katalog paket marketplace
      security: []
      x-requirements: [FR-MKT-01, FR-MKT-02, FR-MKT-03]
      parameters:
        - { name: price_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: duration_days, in: query, schema: { type: integer } }
        - { name: month, in: query, description: 'Format YYYY-MM', schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: airline, in: query, schema: { type: string } }
        - { name: hotel_stars, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: tenant, in: query, description: Slug PPIU, schema: { type: string } }
        - { name: departure_city, in: query, schema: { type: string } }
        - { name: q, in: query, description: Teks bebas, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [price, -price, departure_date, -published_at] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/PackageSummaryList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/packages/{tenantSlug}/{packageSlug}:
    get:
      tags: [Public]
      operationId: getPublicPackage
      summary: Detail paket beserta keberangkatan dan harga resmi
      security: []
      x-requirements: [FR-MKT-04, FR-MKT-05, FR-MKT-10]
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
        - { name: packageSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PackagePublic' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/tenants:
    get:
      tags: [Public]
      operationId: listPublicTenants
      summary: Direktori PPIU terverifikasi
      security: []
      x-requirements: [FR-MKT-06]
      parameters:
        - { name: city, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/TenantPublicList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/tenants/{tenantSlug}:
    get:
      tags: [Public]
      operationId: getPublicTenant
      summary: Profil PPIU dan paket aktifnya
      security: []
      x-requirements: [FR-MKT-06]
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/TenantPublic' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/departures:
    get:
      tags: [Public]
      operationId: listPublicDepartures
      summary: Jadwal keberangkatan lintas PPIU
      security: []
      x-requirements: [FR-MKT-07]
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: departure_city, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/DepartureScheduleList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/config:
    get:
      tags: [Public]
      operationId: getPublicConfig
      summary: Pengaturan publik untuk web (jendela atribusi referral, CR-01)
      security: []
      responses:
        '200': { description: 'OK, data.attribution_window_days (integer)' }
  /public/track:
    get:
      tags: [Public]
      operationId: trackBooking
      summary: Lacak Umrah publik (kode booking + 4 digit akhir HP pemesan), tanpa data pribadi
      security: []
      x-requirements: [Fitur pembeda 2026-11]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: phone, in: query, required: true, schema: { type: string, pattern: '^\\d{4}$' } }
      responses:
        '200': { description: 'OK: code, status, package, tenant, departure, participant_count, journey' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/packages/{tenantSlug}/{packageSlug}/reviews:
    get:
      tags: [Public]
      operationId: listPackageReviews
      summary: Ulasan terverifikasi paket (hanya dari jamaah yang sudah berangkat) + ringkasan rating
      security: []
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
        - { name: packageSlug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: 'OK: data[], meta.summary {avg,count,distribution}, meta.tenant {avg,count}' }
        '4XX': { $ref: '#/components/responses/Error' }
  /public/facets:
    get:
      tags: [Public]
