      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Partnership' }
        '4XX': { $ref: '#/components/responses/Error' }
