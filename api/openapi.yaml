    post:
      tags: [Finance]
      operationId: recordRefund
      summary: Catat refund atau pengalihan dana; 422 refund_exceeds_paid
      x-permission: refund.record
      x-requirements: [FR-FIN-13]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundInput' }
      responses:
        '201': { $ref: '#/components/responses/Refund' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/commissions:
    get:
      tags: [Finance]
      operationId: listTenantCommissions
      summary: Komisi agen di PPIU ini
      x-permission: commission.view
      x-requirements: [FR-FIN-07]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: 'filter[status]', in: query, schema: { $ref: '#/components/schemas/CommissionStatus' } }
        - { name: 'filter[agent_id]', in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: 'filter[departure_id]', in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/CommissionList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/commissions/approve:
    post:
      tags: [Finance]
      operationId: approveCommissions
