  # ============================ TENANT: PAKET DAN KEBERANGKATAN ============================
  /tenants/{tenant}/packages:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Catalog]
      operationId: listPackages
      summary: Paket milik PPIU
      x-permission: package.view
      parameters:
        - { name: 'filter[status]', in: query, schema: { $ref: '#/components/schemas/PackageStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/PackageList' }
        '4XX': { $ref: '#/components/responses/Error' }
    post:
      tags: [Catalog]
      operationId: createPackage
      summary: Buat paket (status draft)
      x-permission: package.manage
      x-requirements: [FR-PPIU-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PackageInput'
                - required: [name, duration_days, airline]
      responses:
        '201': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/PackageId'
    get:
      tags: [Catalog]
      operationId: getPackage
      summary: Detail paket
      x-permission: package.view
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Catalog]
      operationId: updatePackage
      summary: Ubah paket
      x-permission: package.manage
      x-requirements: [FR-PPIU-04]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/duplicate:
    post:
      tags: [Catalog]
