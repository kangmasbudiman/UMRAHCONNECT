      x-permission: platform.tenant.suspend
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, reason]
              properties:
                member_id: { $ref: '#/components/schemas/Uuid' }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Tenant' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/bank-accounts/{account}/verify:
    post:
      tags: [Platform]
      operationId: verifyBankAccount
