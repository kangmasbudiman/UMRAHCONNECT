      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PackageId'
      responses:
        '201': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/packages/{package}/archive:
    post:
      tags: [Catalog]
      operationId: archivePackage
      summary: Arsipkan paket (booking aktif tetap berjalan)
