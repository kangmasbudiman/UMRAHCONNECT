      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200': { $ref: '#/components/responses/BankAccount' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/bank-accounts/{account}/reject:
    post:
      tags: [Platform]
      operationId: rejectBankAccount
      summary: Tolak rekening PPIU
      x-permission: platform.bank_account.verify
      x-requirements: [FR-ADM-05]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/BankAccount' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/packages:
    get:
      tags: [Platform]
      operationId: listPlatformPackages
      summary: Semua paket untuk moderasi
      x-permission: platform.tenant.view
      x-requirements: [FR-ADM-06]
      parameters:
        - { name: 'filter[status]', in: query, schema: { $ref: '#/components/schemas/PackageStatus' } }
        - { name: 'filter[tenant_id]', in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/PackageList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/packages/{package}/take-down:
    post:
      tags: [Platform]
      operationId: takeDownPackage
      summary: Turunkan paket yang melanggar
      x-permission: platform.package.take_down
      x-requirements: [FR-ADM-06]
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/packages/{package}/restore:
    post:
      tags: [Platform]
      operationId: restorePackage
      summary: Izinkan paket yang diturunkan terbit lagi (status kembali ke arsip; PPIU menerbitkan sendiri)
      x-permission: platform.package.take_down
      x-requirements: [FR-ADM-06]
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/bookings/{booking}/review:
    post:
      tags: [Booking]
      operationId: createReview
      summary: Tulis ulasan (hanya pemesan, booking berstatus departed/completed, satu per booking)
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rating, body], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, body: { type: string, minLength: 20, maxLength: 2000 } } }
      responses:
        '201': { description: Created }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/savings-plans:
    get:
      tags: [Me]
      operationId: listSavingsPlans
      summary: Rencana Tabungan Umrah milik pengguna (pencatat; platform tidak menyimpan uang)
      responses:
        '200': { description: OK }
    post:
      tags: [Me]
      operationId: createSavingsPlan
      summary: Buat rencana (target dari paket × jumlah orang bila target_amount kosong)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persons, target_date]
              properties:
                package_id: { type: [string, 'null'], format: uuid }
                label: { type: [string, 'null'] }
                persons: { type: integer, minimum: 1, maximum: 20 }
                target_amount: { type: [integer, 'null'] }
                target_date: { type: string, format: date }
                initial_amount: { type: [integer, 'null'] }
                reminder_day: { type: [integer, 'null'], minimum: 1, maximum: 28 }
      responses:
        '201': { description: Created }
        '4XX': { $ref: '#/components/responses/Error' }
  /me/savings-plans/{plan}:
    parameters:
      - { name: plan, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    patch:
      tags: [Me]
      operationId: updateSavingsPlan
      summary: Ubah rencana (target, tanggal, pengingat, arsip)
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Me]
      operationId: deleteSavingsPlan
      summary: Hapus rencana beserta catatan setoran
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /me/savings-plans/{plan}/entries:
    post:
      tags: [Me]
      operationId: addSavingsEntry
      summary: Catat setoran (positif) atau penarikan (negatif); setoran per bulan dihitung ulang
      parameters:
        - { name: plan, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: integer }, saved_on: { type: string, format: date }, note: { type: string, maxLength: 200 } } }
      responses:
        '201': { description: Created }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/milestones:
    get:
      tags: [Catalog]
      operationId: listDepartureMilestones
      summary: Tahap Lacak Umrah satu keberangkatan
      x-permission: package.view
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: departure, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/departures/{departure}/milestones/{type}:
    put:
      tags: [Catalog]
      operationId: updateDepartureMilestone
      summary: Tandai tahap (visa_submitted, visa_issued, ticket_issued, hotel_confirmed, manasik) selesai/belum; pemesan aktif diberi tahu
      x-permission: departure.manage
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: departure, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [visa_submitted, visa_issued, ticket_issued, hotel_confirmed, manasik] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [pending, done] }, happened_on: { type: [string, 'null'], format: date }, note: { type: [string, 'null'], maxLength: 500 } } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Error' }
  /tenants/{tenant}/reviews:
    get:
      tags: [Tenant]
      operationId: listTenantReviews
      summary: Ulasan terverifikasi untuk PPIU
      x-permission: package.view
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: OK }
  /tenants/{tenant}/reviews/{review}/reply:
    post:
      tags: [Tenant]
      operationId: replyReview
      summary: Balas ulasan (tampil di halaman paket); pengulas diberi tahu
      x-permission: package.manage
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: review, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/reviews:
    get:
      tags: [Platform]
      operationId: listPlatformReviews
      summary: Semua ulasan untuk moderasi
      x-permission: platform.tenant.view
      responses:
        '200': { description: OK }
  /platform/reviews/{review}/hide:
    post:
      tags: [Platform]
      operationId: hideReview
      summary: Sembunyikan ulasan yang melanggar (alasan wajib, tercatat di audit log)
      x-permission: platform.package.take_down
      parameters:
        - { name: review, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: OK }
  /platform/reviews/{review}/unhide:
    post:
      tags: [Platform]
      operationId: unhideReview
      summary: Tampilkan kembali ulasan
      x-permission: platform.package.take_down
      parameters:
        - { name: review, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: OK }
  /platform/users:
    get:
      tags: [Platform]
      operationId: searchUsers
      summary: Cari akun
      x-permission: platform.user.view
      x-requirements: [FR-ADM-07]
      parameters:
        - { name: q, in: query, description: 'Nama, email, atau nomor HP', schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/users/{user}/deactivate:
    post:
      tags: [Platform]
      operationId: deactivateUser
      summary: Nonaktifkan akun (Admin Platform hanya agen dan jamaah)
      x-permission: platform.user.manage
      x-requirements: [FR-ADM-07]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/users/{user}/reactivate:
    post:
      tags: [Platform]
      operationId: reactivateUser
      summary: Aktifkan kembali akun
      x-permission: platform.user.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/User' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/support-sessions:
    post:
      tags: [Platform]
      operationId: openSupportSession
      summary: Buka akses dukungan baca-saja 60 menit; Owner diberi tahu
      x-permission: platform.support_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, reason, ticket_no]
              properties:
                tenant_id: { $ref: '#/components/schemas/Uuid' }
                reason: { type: string }
                ticket_no: { type: string, maxLength: 50 }
      responses:
        '201': { $ref: '#/components/responses/SupportSession' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/support-sessions/{session}:
    delete:
      tags: [Platform]
      operationId: endSupportSession
      summary: Akhiri sesi dukungan lebih awal
      x-permission: platform.support_access
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/audit-logs:
    get:
      tags: [Platform]
      operationId: listAuditLogs
      summary: Audit log (Admin Platform hanya log tenant)
      x-permission: platform.audit_log.view
      x-requirements: [FR-ADM-08]
      parameters:
        - { name: 'filter[tenant_id]', in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: 'filter[actor_user_id]', in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: 'filter[action]', in: query, schema: { type: string } }
        - { name: 'filter[entity_type]', in: query, schema: { type: string } }
        - { name: 'filter[from]', in: query, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: 'filter[to]', in: query, schema: { $ref: '#/components/schemas/Timestamp' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { $ref: '#/components/responses/AuditLogList' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/settings:
    get:
      tags: [Platform]
      operationId: listSettings
      summary: Daftar pengaturan yang bisa diubah beserta nilai dan bawaannya
      x-permission: platform.settings.manage
      x-requirements: [FR-ADM-09]
      responses:
        '200': { description: OK }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/settings/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [Platform]
      operationId: getSetting
      summary: Baca pengaturan sistem
      x-permission: platform.settings.manage
      x-requirements: [FR-ADM-09]
      responses:
        '200': { $ref: '#/components/responses/Setting' }
        '4XX': { $ref: '#/components/responses/Error' }
    put:
      tags: [Platform]
      operationId: putSetting
      summary: Ubah pengaturan sistem
      x-permission: platform.settings.manage
      x-requirements: [FR-ADM-09]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { description: Nilai JSON apa pun. }
      responses:
        '200': { $ref: '#/components/responses/Setting' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/admins:
    get:
      tags: [Platform]
      operationId: listPlatformAdmins
      summary: Daftar Admin Platform
      x-permission: platform.admin.manage
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '4XX': { $ref: '#/components/responses/Error' }
    post:
      tags: [Platform]
      operationId: addPlatformAdmin
      summary: Jadikan user Admin Platform
      x-permission: platform.admin.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { $ref: '#/components/schemas/Uuid' }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '4XX': { $ref: '#/components/responses/Error' }
  /platform/admins/{user}:
    delete:
      tags: [Platform]
      operationId: removePlatformAdmin
      summary: Cabut peran Admin Platform
      x-permission: platform.admin.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '4XX': { $ref: '#/components/responses/Error' }

  # ============================ FILES ============================
  /files:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Unggah file; dirujuk dengan file_id oleh endpoint lain (tidak dirujuk 24 jam = dihapus)
      description: Batas per purpose - foto paket dan logo 2 MB (JPG, PNG, WEBP); dokumen dan bukti 5 MB (JPG, PNG, PDF). Tipe dicek dari isi file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                purpose: { $ref: '#/components/schemas/FilePurpose' }
      responses:
        '201': { $ref: '#/components/responses/File' }
        '4XX': { $ref: '#/components/responses/Error' }
  /files/{file}:
    get:
      tags: [Files]
      operationId: getFile
      summary: Metadata dan URL file (signed URL 10 menit untuk file privat)
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200': { $ref: '#/components/responses/File' }
        '4XX': { $ref: '#/components/responses/Error' }

  # ============================ WEBHOOKS (FASE 2) ============================
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      operationId: receivePaymentWebhook
      summary: Notifikasi payment gateway; diverifikasi tanda tangan, idempoten berdasarkan gateway_ref
      security: []
      x-phase: 2
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Diterima dan disimpan }
        '401': { $ref: '#/components/responses/Error' }
  /webhooks/whatsapp/{provider}:
    post:
      tags: [Webhooks]
      operationId: receiveWhatsappWebhook
      summary: Status kirim pesan WhatsApp
      security: []
      x-phase: 2
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Diterima }
        '401': { $ref: '#/components/responses/Error' }
