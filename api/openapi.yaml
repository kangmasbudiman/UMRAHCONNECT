openapi: 3.1.0
info:
  title: UMRAH CONNECT API
  version: 1.0.0
  summary: Kontrak REST API platform multi-PPIU dan multi-agen UMRAH CONNECT.
  description: >-
    Diturunkan dari API Documentation v1.0 (https://claude.ai/artifact/LTEvaDgYR4s2kMEBFaHNaj),
    SRS v1.1, Database Design v1.2, dan User Role & Permission v1.1.


    Konvensi: JSON UTF-8, field snake_case, ID UUID v7, uang dalam integer Rupiah (field `*_amount`),
    timestamp ISO 8601 UTC. Sukses dibungkus `{"data": ...}`; daftar memakai `{"data": [...], "meta": {...}}`
    dengan paginasi kursor. Error memakai skema `Error`.


    Autentikasi web: sesi cookie Laravel Sanctum. Ambil cookie CSRF lebih dulu lewat
    `GET /sanctum/csrf-cookie` (di luar base URL), lalu kirim header `X-XSRF-TOKEN`.
    Aplikasi mobile (Fase 2) memakai Bearer token dari `POST /auth/tokens`.


    Ekstensi: `x-permission` = permission yang dicek (katalog User Role & Permission);
    `x-requirements` = ID kebutuhan SRS atau proses BPM; `x-phase` = fase bila bukan MVP.
    Data di luar lingkup pengguna dijawab 404 agar keberadaannya tidak bocor.
servers:
  - url: https://api.umrahconnect.id/api/v1
    description: Production (nama domain sementara)
  - url: https://api-staging.umrahconnect.id/api/v1
    description: Staging
  - url: http://localhost:8000/api/v1
    description: Development lokal
tags:
  - name: Auth
    description: Registrasi, login, OTP, 2FA, konteks pengguna
  - name: Public
    description: Marketplace publik tanpa login
  - name: Me
    description: Akun, data jamaah, dan booking milik pemesan
  - name: Agent
    description: Portal agen
  - name: Tenant
    description: Profil PPIU, tim, rekening, dashboard
  - name: Catalog
    description: Paket dan keberangkatan PPIU
  - name: Partnership
    description: Kemitraan agen dan skema komisi
  - name: Booking
    description: Booking, dokumen jamaah, catatan internal
  - name: Finance
    description: Invoice, pembayaran, refund, komisi, payout
  - name: Report
    description: Laporan dan ekspor
  - name: Platform
    description: Super Admin dan Admin Platform
  - name: Files
    description: Unggah dan akses file
  - name: Webhooks
    description: Webhook masuk dari vendor (Fase 2)
security:
  - sessionCookie: []
  - bearerAuth: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: umrah_connect_session
      description: Sesi Laravel Sanctum untuk aplikasi web; wajib header X-XSRF-TOKEN pada permintaan non-GET.
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum untuk aplikasi Android (Fase 2), ability `agent` atau `pilgrim`.

  parameters:
    TenantId:
      name: tenant
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    BookingId:
      name: booking
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PackageId:
      name: package
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DepartureId:
      name: departure
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PartnershipId:
      name: partnership
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SchemeId:
      name: scheme
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    InvoiceId:
      name: invoice
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PaymentId:
      name: payment
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReceiptId:
      name: receipt
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PayoutId:
      name: payout
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PilgrimId:
      name: pilgrim
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DocumentId:
      name: document
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MemberId:
      name: member
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AccountId:
      name: account
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ImageId:
      name: image
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LinkId:
      name: link
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProspectId:
      name: prospect
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId:
      name: user
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SessionId:
      name: session
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FileId:
      name: file
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Kursor opaque dari `meta.next_cursor` halaman sebelumnya.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Nama field; awali tanda minus untuk urutan menurun, contoh `-created_at`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unik per aksi; kunci sama dalam 24 jam mengembalikan respons pertama.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Nilai ETag dari respons GET terakhir; tidak cocok menghasilkan 412.
      schema: { type: string }

  responses:
    Error:
      description: Error (lihat `error.code`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: Berhasil tanpa isi
    Accepted:
      description: Diterima dan diproses di antrean; hasil dikirim lewat notifikasi
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  status: { type: string, const: queued }
    Pdf:
      description: Berkas PDF
      content:
        application/pdf:
          schema: { type: string, contentMediaType: application/pdf }
    SignedUrl:
      description: Signed URL berumur 10 menit
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { $ref: '#/components/schemas/Timestamp' }
    User:
      description: Berhasil
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/User' } } } } }
    UserList:
      description: Berhasil
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } }, meta: { $ref: '#/components/schemas/ListMeta' } } } } }
    TenantPublic:
      description: Berhasil
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TenantPublicDetail' } } } } }
    TenantPublicList:
      description: Berhasil
      content: { application/json: { schema: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/TenantPublic' } }, meta: { $ref: '#/components/schemas/ListMeta' } } } } }
    Tenant:
      description: Berhasil
      content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Tenant' } } } } }
    TenantList:
      description: Berhasil
