<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMRAH CONNECT — Prototipe alur jual inti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Token dari dokumen UI/UX Design v1.0 bagian 2 */
  :root {
    --primary-700: #0F5E4A; --primary-600: #157A60; --primary-50: #E8F4F0;
    --gold-500: #C8A24A; --gold-700: #8A6A1F;
    --ink-900: #1F2937; --ink-600: #4B5563; --surface: #F7F7F5; --white: #FFFFFF;
    --border-input: #667085; --border-subtle: #D0D5DD;
    --success: #067647; --success-bg: #ECFDF3; --warning: #B54708; --warning-bg: #FFFAEB;
    --danger: #B42318; --danger-bg: #FEF3F2; --info: #175CD3; --info-bg: #EFF8FF;
    --radius: 8px; --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); font-size: 16px; line-height: 24px; color: var(--ink-900); background: var(--surface); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary-700); }
  :focus-visible { outline: 2px solid var(--primary-600); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-600); }
  .small { font-size: 14px; line-height: 20px; }
  h1 { font-size: 24px; line-height: 32px; margin: 0 0 4px; }
  h2 { font-size: 20px; line-height: 28px; margin: 24px 0 8px; }
  h3 { font-size: 16px; line-height: 24px; margin: 16px 0 8px; }

  /* Bilah demo */
  .demobar { position: sticky; top: 0; z-index: 10; background: var(--ink-900); color: var(--white); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .demobar strong { font-size: 14px; }
  .demobar nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .demobar a, .demobar button { color: var(--white); background: transparent; border: 1px solid #667085; border-radius: 999px; padding: 4px 12px; font-size: 13px; line-height: 20px; text-decoration: none; cursor: pointer; min-height: 32px; }
  .demobar a[aria-current="page"] { background: var(--primary-700); border-color: var(--primary-700); }
  .demobar .spacer { flex: 1; }
  @media (max-width: 600px) {
    .demobar { padding: 6px 12px; }
    .demobar strong { font-size: 12px; flex: 1; }
    .demobar .spacer { display: none; }
    .demobar nav { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .demobar a { white-space: nowrap; }
  }

  /* Bingkai ponsel untuk layar agen dan jamaah */
  .stage { padding: 24px 16px 48px; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px 16px 24px; min-height: 720px; position: relative; }
  .desktop { width: 100%; max-width: 1200px; background: var(--white); border: 1px solid var(--border-subtle); border-radius: 12px; display: grid; grid-template-columns: 200px 1fr; min-height: 640px; overflow: hidden; }
  .screen-id { font-size: 12px; color: var(--ink-600); letter-spacing: .02em; margin-bottom: 8px; }
  .topbar { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 16px; }
  .topbar a { text-decoration: none; font-size: 22px; line-height: 1; padding: 8px; margin-left: -8px; min-width: 40px; }
  .topbar .title { font-weight: 600; }

  /* Komponen */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--radius); border: 1px solid var(--border-input); background: var(--white); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink-900); }
  .btn.primary { background: var(--primary-700); border-color: var(--primary-700); color: var(--white); }
  .btn.primary:hover { background: var(--primary-600); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-row > * { flex: 1; }
  .card { border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0; background: var(--white); }
  .card.tint { background: var(--surface); }
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 12px; font-size: 13px; line-height: 22px; font-weight: 600; border: 1px solid transparent; }
  .badge.verified { background: var(--primary-50); color: var(--primary-700); border-color: var(--primary-700); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
  .badge.success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .badge.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  .badge.info { background: var(--info-bg); color: var(--info); border-color: var(--info); }
  .badge.gold { background: var(--gold-500); color: var(--ink-900); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .row strong, .row span:last-child { text-align: right; }
  .alert { border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; border: 1px solid; }
  .alert.danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .alert.info { background: var(--info-bg); border-color: var(--info); color: var(--info); }
  .alert.warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
  .alert.success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .img-ph { background: linear-gradient(135deg, #DDE8E3, #F1EBDC); border-radius: var(--radius); height: 168px; display: flex; align-items: center; justify-content: center; color: var(--ink-600); font-size: 14px; }
  .option { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border-input); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0; cursor: pointer; background: var(--white); }
  .option input { margin-top: 4px; width: 20px; height: 20px; accent-color: var(--primary-700); }
  .option.selected { border: 2px solid var(--primary-700); background: var(--primary-50); padding: 11px 15px; }
  label.field { display: block; margin: 12px 0; }
  label.field > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=date], select, textarea { width: 100%; min-height: 48px; border: 1px solid var(--border-input); border-radius: var(--radius); padding: 10px 12px; background: var(--white); }
  .hint { font-size: 13px; line-height: 18px; color: var(--ink-600); margin-top: 4px; }
  .steps { display: flex; gap: 4px; margin: 0 0 16px; }
  .steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--border-subtle); }
  .steps span.done { background: var(--primary-700); }
  .bottomnav { display: flex; border-top: 1px solid var(--border-subtle); margin-top: 24px; padding-top: 8px; }
  .bottomnav a { flex: 1; text-align: center; text-decoration: none; color: var(--ink-600); font-size: 14px; padding: 8px 0; min-height: 44px; }
  .bottomnav a.active { color: var(--primary-700); font-weight: 700; }
  .wa-bubble { background: #E7F7E2; border-radius: 12px 12px 12px 2px; padding: 12px 14px; font-size: 14px; line-height: 20px; white-space: pre-line; }
  .countdown { font-size: 20px; font-weight: 700; }
  .money { font-size: 18px; font-weight: 700; }
  .acc { font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  .proof-preview { max-width: 100%; max-height: 220px; border-radius: var(--radius); border: 1px solid var(--border-subtle); margin-top: 8px; }

  /* Desktop PPIU */
  .side { background: var(--surface); border-right: 1px solid var(--border-subtle); padding: 20px 12px; }
  .side .brand { font-weight: 700; padding: 0 8px 16px; }
  .side a { display: block; padding: 8px 12px; border-radius: var(--radius); text-decoration: none; color: var(--ink-600); margin: 2px 0; }
  .side a.active { background: var(--primary-50); color: var(--primary-700); font-weight: 700; border: 1px solid var(--primary-700); }
  .mainpane { padding: 24px; overflow: auto; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .chip { border: 1px solid var(--border-input); border-radius: 999px; padding: 4px 14px; font-size: 14px; background: var(--white); cursor: pointer; min-height: 36px; }
  .chip.active { border: 2px solid var(--primary-700); background: var(--primary-50); font-weight: 700; }
  table.queue { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
  table.queue th { text-align: left; color: var(--ink-600); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--border-input); }
  table.queue td { padding: 10px 8px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
  table.queue tr.sel td { background: var(--primary-50); }
  table.queue tr { cursor: pointer; }
  table.queue tr.new td:first-child { box-shadow: inset 4px 0 0 var(--gold-500); }
  .detail { display: grid; grid-template-columns: 220px 1fr; gap: 20px; border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 16px; margin-top: 20px; }
  .proofbox { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); min-height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-600); font-size: 14px; overflow: hidden; }
  .proofbox img { max-width: 100%; max-height: 260px; }
  @media (max-width: 860px) {
    .desktop { grid-template-columns: 1fr; }
    .side { display: none; }
    .detail { grid-template-columns: 1fr; }
  }

  /* Modal dan toast */
  .modal-bg { position: fixed; inset: 0; background: rgba(17, 24, 39, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal { background: var(--white); border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink-900); color: var(--white); padding: 10px 16px; border-radius: var(--radius); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  #toast.show { opacity: 1; }
  .guide { max-width: 720px; margin: 0 auto; }
  .guide ol { padding-left: 20px; }
  .guide li { margin: 8px 0; }
</style>
</head>
<body>
<header class="demobar" role="banner">
  <strong>UMRAH CONNECT · Prototipe alur jual inti</strong>
  <nav aria-label="Langkah demo" id="demo-nav"></nav>
  <span class="spacer"></span>
  <button type="button" data-action="reset">Reset demo</button>
</header>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ------------------------------------------------------------------
// Data contoh (angka sama dengan API Documentation v1.0 bagian 11)
// ------------------------------------------------------------------
const PKG = {
  name: 'Umrah Reguler 12 Hari', slug: 'umrah-reguler-12-hari',
  tenant: 'PPIU A', tenantLegal: 'PT PPIU A', license: 'Izin PPIU (contoh) U.123/2023',
  airline: 'Saudia', hotelStars: 4, days: 12,
  prices: { quad: 32500000, triple: 35000000, double: 38000000 },
  departures: [
    { id: 'd1', date: '2027-02-10', city: 'Jambi', seats: 14 },
    { id: 'd2', date: '2027-03-10', city: 'Jambi', seats: 2 },
  ],
  dpPerPax: 5000000, finalDue: '2027-01-11',
  bank: { name: 'Bank Syariah Indonesia', no: '7xxxxxxxx1', holder: 'PT PPIU A' },
  cancelPolicy: 'Batal > 45 hari sebelum berangkat: refund 75%. 30–45 hari: 50%. < 30 hari: DP hangus.',
};
const ROOM_LABEL = { quad: 'Quad (4 orang)', triple: 'Triple (3 orang)', double: 'Double (2 orang)' };
const AGENT = { name: 'Budi', code: 'BUDI24', ref: 'Q7KX2M', wa: '+6281200000024', commissionPerPax: 1000000 };
const FAMILY = [
  { id: 'j1', name: 'Ahmad', gender: 'L', relation: 'Diri sendiri' },
  { id: 'j2', name: 'Siti', gender: 'P', relation: 'Istri' },
  { id: 'j3', name: 'Fatimah', gender: 'P', relation: 'Ibu' },
  { id: 'j4', name: 'Umar', gender: 'L', relation: 'Anak' },
];
const OLD_QUEUE = [
  { id: 'p-old1', code: 'UC-2611-0003', booker: 'Ahmad Fauzi', invType: 'DP', inv: 'INV-0016', claimed: 10000000, date: '2026-11-14', bank: 'BRI', ageH: 5, invAmount: 10000000 },
  { id: 'p-old2', code: 'UC-2610-0042', booker: 'Nur Aini', invType: 'Pelunasan', inv: 'INV-0009', claimed: 60000000, date: '2026-11-13', bank: 'Mandiri', ageH: 26, invAmount: 60000000 },
  { id: 'p-old3', code: 'UC-2610-0031', booker: 'Hasan Basri', invType: 'Pelunasan', inv: 'INV-0004', claimed: 25000000, date: '2026-11-12', bank: 'BSI', ageH: 50, invAmount: 25000000 },
];

const STORE_KEY = 'uc-proto-v1';
const initialState = () => ({
  refCookie: null,          // {code, at} — meniru cookie uc_ref 30 hari
  draft: { departureId: 'd1', participants: [], rooms: {}, accept: false },
  booking: null,            // booking hasil konfirmasi
  oldQueue: OLD_QUEUE.map(q => ({ ...q, status: 'pending' })),
  selectedPayment: null,
  receiptSeq: 7,
});
let S = load();
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || initialState(); } catch (e) { return initialState(); } }
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

// ------------------------------------------------------------------
// Format (pedoman microcopy bagian 8)
// ------------------------------------------------------------------
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const fmtDate = (iso, opts) => new Intl.DateTimeFormat('id-ID', Object.assign({ timeZone: 'Asia/Jakarta' }, opts)).format(new Date(iso));
const longDate = iso => fmtDate(iso.length === 10 ? iso + 'T00:00:00+07:00' : iso, { day: 'numeric', month: 'short', year: 'numeric' });
const dueText = iso => fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'short' }) + ', ' + fmtDate(iso, { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '.') + ' WIB';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const digits = s => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
const dep = id => PKG.departures.find(d => d.id === id);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

// ------------------------------------------------------------------
// Aturan bisnis (SRS CR-01, CR-03, CR-04; BP-05, BP-06)
// ------------------------------------------------------------------
function seatsLeft(d) {
  let used = 0;
  if (S.booking && S.booking.departureId === d.id && S.booking.status !== 'expired') used = S.booking.participants.length;
  return d.seats - used;
}
function activeAgent() {
  // CR-01: referral tersimpan dalam 30 hari dan kemitraan Aktif (selalu aktif di prototipe)
  if (!S.refCookie) return null;
  const ageDays = (Date.now() - S.refCookie.at) / 864e5;
  return ageDays <= 30 && S.refCookie.code === AGENT.ref ? AGENT : null;
}
function quote() {
  const parts = S.draft.participants.map(id => {
    const f = FAMILY.find(x => x.id === id);
    const room = S.draft.rooms[id] || 'quad';
    return { id, name: f.name, room, price: PKG.prices[room] };
  });
  const total = parts.reduce((a, p) => a + p.price, 0);
  const dp = PKG.dpPerPax * parts.length;
  return { parts, total, dp, final: total - dp };
}
function confirmBooking() {
  const d = dep(S.draft.departureId);
  const q = quote();
  if (q.parts.length > seatsLeft(d)) {
    return { error: 'seats_unavailable', message: `Maaf, sisa kursi tinggal ${seatsLeft(d)}. Kurangi peserta atau pilih keberangkatan lain.` };
  }
  const agent = activeAgent();
  const now = Date.now();
  S.booking = {
    code: 'UC-2611-0001', createdAt: now, holdExpires: now + 48 * 3600e3,
    departureId: d.id, participants: q.parts, total: q.total, dp: q.dp, paid: 0, status: 'awaiting_dp',
    agent: agent ? { name: agent.name, code: agent.code } : null,
    attribution: agent ? 'referral_link' : 'none',
    commission: agent ? { amount: agent.commissionPerPax * q.parts.length, status: 'estimated' } : null,
    invoices: [
      { key: 'dp', no: 'INV/PPIUA/2026/0012', short: 'INV-0012', type: 'DP', amount: q.dp, paid: 0, due: new Date(now + 48 * 3600e3).toISOString() },
      { key: 'final', no: 'INV/PPIUA/2026/0013', short: 'INV-0013', type: 'Pelunasan', amount: q.final, paid: 0, due: PKG.finalDue + 'T00:00:00+07:00' },
    ],
    payments: [], receipts: [],
  };
  save();
  return { ok: true };
}
function invStatus(inv) { return inv.paid >= inv.amount ? 'Lunas' : inv.paid > 0 ? 'Sebagian' : 'Belum dibayar'; }
function verifyPayment(payId, amount) {
  const b = S.booking; const p = b.payments.find(x => x.id === payId);
  if (!p || p.status !== 'pending') return { error: 'already_processed' };
  // FR-FIN-14: kelebihan bayar DP dipecah ke invoice pelunasan
  const dpInv = b.invoices[0], finInv = b.invoices[1];
  const remDp = dpInv.amount - dpInv.paid;
  const toDp = Math.min(amount, remDp);
  const extra = toDp > 0 ? amount - toDp : 0;
  const receipt = (amt, inv) => b.receipts.push({ no: `KW/PPIUA/2026/${String(S.receiptSeq++).padStart(4, '0')}`, amount: amt, inv: inv.short });
  p.status = 'verified';
  if (toDp > 0) {
    p.verified = toDp; p.invoice = 'dp'; dpInv.paid += toDp; receipt(toDp, dpInv);
    if (extra > 0) {
      b.payments.push({ id: p.id + '-split', splitFrom: p.id, invoice: 'final', claimed: extra, verified: extra, date: p.date, bank: p.bank, sender: p.sender, status: 'verified' });
      finInv.paid += extra; receipt(extra, finInv);
    }
  } else {
    // DP sudah lunas: seluruh nominal untuk invoice pelunasan
    p.verified = amount; p.invoice = 'final'; finInv.paid += amount; receipt(amount, finInv);
  }
  b.paid += amount;
  if (dpInv.paid >= dpInv.amount && b.status === 'awaiting_dp') b.status = 'dp_verified';
  if (b.paid >= b.total) { b.status = 'fully_paid'; if (b.commission) b.commission.status = 'earned'; }
  save();
  return { ok: true, split: extra };
}
function statusBadge(st) {
  const m = { awaiting_dp: ['warning', 'Menunggu DP'], dp_verified: ['info', 'DP Diterima'], fully_paid: ['success', 'Lunas'], expired: ['danger', 'Kedaluwarsa'], cancelled: ['danger', 'Dibatalkan'] };
  const [c, t] = m[st] || ['info', st];
  const icon = c === 'success' ? '✓' : c === 'danger' ? '✕' : c === 'warning' ? '⏳' : 'ℹ';
  return `<span class="badge ${c}"><span aria-hidden="true">${icon}</span>${t}</span>`;
}

// ------------------------------------------------------------------
// Navigasi demo
// ------------------------------------------------------------------
const STEPS = [
  ['#/', 'Panduan'], ['#/agen', '1 Agen'], ['#/agen/bagikan', '2 Bagikan'], ['#/paket', '3 Paket'],
  ['#/booking/1', '4 Booking'], ['#/bayar', '5 Bayar'], ['#/ppiu', '6 PPIU verifikasi'], ['#/booking-saya', '7 Hasil jamaah'],
];
function renderNav(hash) {
  const base = hash.split('?')[0];
  document.getElementById('demo-nav').innerHTML = STEPS.map(([h, l]) => {
    const cur = base === h || (h === '#/booking/1' && base.startsWith('#/booking/')) ? ' aria-current="page"' : '';
    return `<a href="${h}"${cur}>${l}</a>`;
  }).join('');
}

// ------------------------------------------------------------------
// Layar
// ------------------------------------------------------------------
const phone = (id, body) => `<div class="stage"><section class="phone" aria-label="${esc(id)}"><div class="screen-id">${esc(id)}</div>${body}</section></div>`;
const topBar = (back, title) => `<div class="topbar"><a href="${back}" aria-label="Kembali">‹</a><span class="title">${title}</span></div>`;

const VIEWS = {
  '#/': () => `<div class="stage"><section class="phone guide" style="max-width:720px">
    <h1>Prototipe alur jual inti</h1>
    <p class="muted">Prototipe klik untuk uji kegunaan (UI/UX Design v1.0, bagian 10). Data hanya contoh dan tersimpan di peramban ini; tidak ada server.</p>
    <h2>Skenario uji</h2>
    <ol>
      <li><strong>Agen Budi</strong> membuka beranda lalu membagikan paket <em>Umrah Reguler 12 Hari</em> ke WhatsApp.</li>
      <li><strong>Calon jamaah</strong> membuka link, memilih keberangkatan 10 Feb 2027, lalu booking untuk 3 orang (Ahmad, Siti, Fatimah; 2 Quad + 1 Double).</li>
      <li>Jamaah melihat instruksi bayar, lalu mengunggah bukti transfer. Coba isi <strong>Rp20.000.000</strong> untuk menguji kelebihan bayar.</li>
      <li><strong>Finance PPIU A</strong> memverifikasi bukti di antrean.</li>
      <li>Jamaah dan agen melihat hasilnya: DP Diterima, kwitansi, dan komisi agen.</li>
    </ol>
    <h2>Kasus tambahan</h2>
    <ul>
      <li>Pilih keberangkatan 10 Mar 2027 (sisa 2 kursi) dengan 3 peserta untuk melihat pesan <code>seats_unavailable</code>.</li>
      <li>Di antrean PPIU, tolak bukti dengan alasan untuk melihat alur unggah ulang.</li>
      <li>Buka katalog tanpa link agen (<a href="#/katalog">Katalog</a>) untuk booking tanpa atribusi.</li>
    </ul>
    <div class="btn-row"><a class="btn primary" href="#/agen">Mulai sebagai agen</a><a class="btn" href="#/katalog">Mulai sebagai jamaah</a></div>
  </section></div>`,

function detailPanel(r) {
  const isFlow = !!r.isNew;
  const b = S.booking;
  const inv = isFlow ? b.invoices[r.invKey === 'final' ? 1 : 0] : null;
  const dpRem = isFlow ? inv.amount - inv.paid : r.invAmount;
  const extra = isFlow && r.invKey !== 'final' ? Math.max(0, r.claimed - dpRem) : 0;
  return `<div class="detail" aria-label="Detail pembayaran terpilih">
    <div class="proofbox">${r.proof ? `<img src="${r.proof}" alt="Bukti transfer dari ${esc(r.booker)}">` : 'Bukti transfer<br>(contoh)'}</div>
    <div>
      <h3 style="margin-top:0">${r.code} · Invoice ${r.invType} ${rp(isFlow ? inv.amount : r.invAmount)}</h3>
      <div class="small muted">Diklaim ${rp(r.claimed)} · ${longDate(r.date)} · ${esc(r.bank)} a.n. ${esc(r.booker)}</div>
      ${isFlow && extra > 0 ? `<div class="alert info small">Kelebihan ${rp(extra)} otomatis dicatat sebagai pembayaran invoice pelunasan.</div>` : ''}
      ${isFlow && b.agent ? `<div class="small muted" style="margin-top:6px">Agen: ${b.agent.name} · komisi estimasi ${rp(b.commission.amount)}</div>` : ''}
      <form id="verify-form" data-id="${r.id}" novalidate>
        <label class="field"><span>Nominal diterima di rekening</span><input type="text" inputmode="numeric" id="v-amount" value="${r.claimed.toLocaleString('id-ID')}" aria-describedby="v-hint"><div class="hint" id="v-hint">Cocokkan dengan mutasi rekening ${PKG.bank.name}.</div></label>
        <div id="verify-error"></div>
        <div class="btn-row" style="max-width:420px"><button type="submit" class="btn primary">Verifikasi</button><button type="button" class="btn danger" data-action="reject" data-id="${r.id}">Tolak</button></div>
        <p class="hint">Kwitansi terbit otomatis setelah verifikasi.</p>
      </form>
    </div></div>`;
}
function statusText(b) {
  if (b.status === 'awaiting_dp') {
    const pend = b.payments.some(p => p.status === 'pending');
    return pend ? 'Bukti DP sedang diperiksa PPIU' : `Bayar DP ${rp(b.invoices[0].amount - b.invoices[0].paid)} sebelum ${dueText(new Date(b.holdExpires).toISOString())}`;
  }
  if (b.status === 'dp_verified') return `Pelunasan ${rp(b.invoices[1].amount - b.invoices[1].paid)} jatuh tempo ${longDate(PKG.finalDue)}`;
  if (b.status === 'fully_paid') return 'Pembayaran lengkap. Lengkapi dokumen sebelum berangkat.';
  return '';
}
function remaining(ts) {
  const ms = ts - Date.now();
  if (ms <= 0) return 'Batas waktu DP sudah lewat';
  const h = Math.floor(ms / 3600e3), m = Math.floor((ms % 3600e3) / 60e3);
  return `Sisa ${h} jam ${m} menit`;
}
function alreadyBooked() {
  const b = S.booking;
  return phone('JMH-03 Booking', `${topBar('#/paket', 'Booking')}
    <div class="alert warning">${b.participants.map(p => p.name).join(', ')} sudah terdaftar di keberangkatan ini (${b.code}).</div>
    <p class="small muted">Satu jamaah tidak dapat terdaftar dua kali di keberangkatan yang sama (pesan <code>pilgrim_already_booked</code>). Tekan Reset demo untuk mengulang skenario.</p>
    <a class="btn primary block" href="#/booking-saya">Lihat booking</a>`);
}
function noBooking() {
  return phone('Belum ada booking', `<div class="alert info">Anda belum punya booking.</div><a class="btn primary block" href="#/katalog">Lihat paket umrah</a>`);
}

// ------------------------------------------------------------------
// Router dan event
// ------------------------------------------------------------------
function route() {
  let hash = location.hash || '#/';
  const [path, qs] = hash.split('?');
  if (path === '#/paket' && qs) {
    const ref = new URLSearchParams(qs).get('ref');
    if (ref) { S.refCookie = { code: ref, at: Date.now() }; save(); }   // meniru cookie uc_ref (ditimpa link terbaru)
  }
  const view = VIEWS[path] || VIEWS['#/'];
  renderNav(hash);
  document.getElementById('app').innerHTML = view();
  document.title = 'UMRAH CONNECT — ' + ((document.querySelector('.screen-id') || {}).textContent || 'Prototipe');
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'toast') { e.preventDefault(); toast(el.dataset.msg); }
  if (a === 'reset') { localStorage.removeItem(STORE_KEY); S = initialState(); location.hash = '#/'; route(); toast('Demo direset'); }
  if (a === 'go') location.hash = el.dataset.to;
  if (a === 'copy') { e.preventDefault(); (navigator.clipboard ? navigator.clipboard.writeText(el.dataset.text) : Promise.reject()).then(() => toast('Disalin'), () => toast('Salin: ' + el.dataset.text)); }
  if (a === 'wa') { e.preventDefault(); toast('Membuka WhatsApp ke ' + el.dataset.to + ' (simulasi)'); }
  if (a === 'share-wa') openShareModal();
  if (a === 'open-as-jamaah') { closeModal(); location.hash = `#/paket?ref=${AGENT.ref}`; }
  if (a === 'close-modal') closeModal();
  if (a === 'confirm') {
    const r = confirmBooking();
    if (r.error) document.getElementById('book-error').innerHTML = `<div class="alert danger" role="alert">${r.message}<br><a href="#/paket">Pilih keberangkatan lain</a></div>`;
    else { location.hash = '#/bayar'; toast('Booking dibuat, kursi ditahan 48 jam'); }
  }
  if (a === 'sample-proof') { useSampleProof(); }
  if (a === 'select-pay') { S.selectedPayment = el.dataset.id; save(); route(); }
  if (a === 'reject') openRejectModal(el.dataset.id);
  if (a === 'do-reject') doReject(el.dataset.id);
});
document.addEventListener('keydown', e => {
  const row = e.target.closest && e.target.closest('tr[data-action="select-pay"]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
  if (e.key === 'Escape') closeModal();
});
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.action;
  if (a === 'pick-dep') { S.draft.departureId = el.value; save(); route(); }
  if (a === 'toggle-pax') {
    const set = new Set(S.draft.participants);
    el.checked ? set.add(el.value) : set.delete(el.value);
    S.draft.participants = FAMILY.map(f => f.id).filter(id => set.has(id)); save(); route();
  }
  if (a === 'room') { S.draft.rooms[el.dataset.id] = el.value; save(); }
  if (a === 'accept') { S.draft.accept = el.checked; save(); route(); }
  if (el.id === 'f-file' && el.files[0]) {
    const f = el.files[0];
    if (f.size > 5 * 1024 * 1024) { document.getElementById('upload-error').innerHTML = '<div class="alert danger" role="alert">File lebih dari 5 MB. Pilih file yang lebih kecil.</div>'; el.value = ''; return; }
    compressImage(f).then(url => { pendingProof = url; document.getElementById('file-preview').innerHTML = url ? `<img class="proof-preview" src="${url}" alt="Pratinjau bukti transfer">` : '<p class="small">PDF dipilih: ' + esc(f.name) + '</p>'; });
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'upload-form') submitProof();
  if (e.target.id === 'verify-form') {
    const id = e.target.dataset.id; const amt = digits(document.getElementById('v-amount').value);
    if (!amt) { document.getElementById('verify-error').innerHTML = '<div class="alert danger" role="alert">Isi nominal yang diterima.</div>'; return; }
    const flowPay = S.booking && S.booking.payments.find(p => p.id === id);
    if (flowPay) {
      const r = verifyPayment(id, amt);
      if (r.error) { toast('Pembayaran ini sudah diproses oleh rekan Anda.'); route(); return; }
      toast(r.split ? `Terverifikasi. Kelebihan ${rp(r.split)} dicatat untuk pelunasan` : 'Terverifikasi. Kwitansi terbit');
    } else {
      const q = S.oldQueue.find(x => x.id === id); q.status = 'verified'; save(); toast('Terverifikasi (data contoh)');
    }
    S.selectedPayment = null; save(); route();
  }
});

let pendingProof = null;
function compressImage(file) {
  // NFR/UI bagian 9: foto dikompres di peramban, sisi terpanjang maks. 1.600 px
  if (!file.type.startsWith('image/')) return Promise.resolve(null);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // pratinjau kecil agar muat di localStorage
      const t = document.createElement('canvas'); const s2 = Math.min(1, 480 / Math.max(c.width, c.height));
      t.width = Math.round(c.width * s2); t.height = Math.round(c.height * s2); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
      res(t.toDataURL('image/jpeg', 0.7)); URL.revokeObjectURL(img.src);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}
function useSampleProof() {
  const c = document.createElement('canvas'); c.width = 360; c.height = 480; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 360, 480); g.fillStyle = '#0F5E4A'; g.fillRect(0, 0, 360, 64);
  g.fillStyle = '#ffffff'; g.font = 'bold 20px sans-serif'; g.fillText('Transfer Berhasil', 20, 40);
  g.fillStyle = '#1F2937'; g.font = '16px sans-serif';
  const amt = digits(document.getElementById('f-amount').value);
  ['Ke: ' + PKG.bank.holder, 'Rek: ' + PKG.bank.no, 'Nominal: ' + rp(amt), 'Tanggal: ' + document.getElementById('f-date').value, 'Dari: ' + document.getElementById('f-sender').value, '(BUKTI CONTOH)']
    .forEach((l, i) => g.fillText(l, 20, 110 + i * 34));
  pendingProof = c.toDataURL('image/jpeg', 0.7);
  document.getElementById('file-preview').innerHTML = `<img class="proof-preview" src="${pendingProof}" alt="Pratinjau bukti transfer contoh">`;
}
function submitProof() {
  const amt = digits(document.getElementById('f-amount').value);
  const sender = document.getElementById('f-sender').value.trim();
  const err = [];
  if (!amt) err.push('Isi nominal transfer.');
  if (!sender) err.push('Isi nama pemilik rekening pengirim.');
  if (!pendingProof && !document.getElementById('f-file').files[0]) err.push('Lampirkan foto atau PDF bukti, atau pakai bukti contoh.');
  if (err.length) { document.getElementById('upload-error').innerHTML = `<div class="alert danger" role="alert">${err.join('<br>')}</div>`; return; }
  const b = S.booking;
  const invKey = b.invoices[0].paid < b.invoices[0].amount ? 'dp' : 'final';
  b.payments.push({ id: 'pay-' + Date.now(), invoice: invKey, claimed: amt, date: document.getElementById('f-date').value, bank: document.getElementById('f-bank').value, sender, status: 'pending', at: Date.now(), proof: pendingProof });
  pendingProof = null; save();
  toast('Bukti terkirim. PPIU A akan memeriksa.');
  location.hash = '#/bayar';
}
function openShareModal() {
  const wrap = document.createElement('div'); wrap.className = 'modal-bg'; wrap.id = 'modal';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title" style="margin-top:0">Simulasi WhatsApp</h2>
    <p>Pesan dan link terkirim ke calon jamaah. Lanjutkan skenario dengan membuka link sebagai calon jamaah.</p>
    <div class="btn-row"><button type="button" class="btn" data-action="close-modal">Tutup</button><button type="button" class="btn primary" data-action="open-as-jamaah">Buka link sebagai jamaah</button></div></div>`;
  document.body.appendChild(wrap); wrap.querySelector('.primary').focus();
}
function openRejectModal(id) {
  const wrap = document.createElement('div'); wrap.className = 'modal-bg'; wrap.id = 'modal';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="r-title"><h2 id="r-title" style="margin-top:0">Tolak bukti bayar</h2>
    <label class="field"><span>Alasan (dikirim ke pemesan dan agen)</span><select id="r-reason"><option>Nominal tidak masuk ke rekening</option><option>Bukti tidak terbaca</option><option>Transfer ke rekening lain</option></select></label>
    <div class="btn-row"><button type="button" class="btn" data-action="close-modal">Batal</button><button type="button" class="btn danger" data-action="do-reject" data-id="${id}">Tolak bukti</button></div></div>`;
  document.body.appendChild(wrap); wrap.querySelector('select').focus();
}
function doReject(id) {
  const reason = document.getElementById('r-reason').value;
  const p = S.booking && S.booking.payments.find(x => x.id === id);
  if (p) { p.status = 'rejected'; p.reason = reason; } else { const q = S.oldQueue.find(x => x.id === id); if (q) q.status = 'rejected'; }
  S.selectedPayment = null; save(); closeModal(); route(); toast('Bukti ditolak; pemesan dan agen diberi tahu');
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }

setInterval(() => { const c = document.getElementById('countdown'); if (c && S.booking) c.textContent = remaining(S.booking.holdExpires); }, 30000);
route();
</script>
